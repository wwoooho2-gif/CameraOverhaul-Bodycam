# General
maven_group = "t2ws"
root_package = "mirsario.cameraoverhaul"
archives_base_name = "CameraOverhaul-Bodycam"

# Mod Properties
# NOTE: mod.id and the Java package are intentionally kept the same as the original
# CameraOverhaul, so this fork replaces it (the two must not be installed together).
mod.id = "cameraoverhaul"
mod.name = "CameraOverhaul: Bodycam Edition"
mod.version = "2.1.2"
mod.version_type = "release"
mod.description = """
CameraOverhaul: Bodycam Edition by T2ws is a fork of Mirsario's CameraOverhaul that makes the first-person camera behave like a body-mounted camera strapped to your chest.
Footsteps jolt the view, the camera trails behind your mouse movement and settles, and heavier breathing and inertia sell the weight of the body.
Underneath sits a realism layer: footstep-timed gait, landing and jump impacts, neck inertia, breathing and fatigue. Everything from the original mod is still there.

Client-side only and rotation-only: your actual aim is never changed.
Configurable through GUIs as well as the '.minecraft/config/cameraoverhaul.toml' file.
"""
mod.authors = """
T2ws
"""
mod.contributors = """
Mirsario (author of the original CameraOverhaul)
archiso86
altrisi
sam-mccarthy
IMS212
TheMrEngMan
Lucanoria
mpustovoi
TheLegendofSaram
stabery
czfortythree
Xinyang-Gao
"""

